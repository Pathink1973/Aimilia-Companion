name: Validar projeto público
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/verify_public.py
      - run: python3 scripts/test_firmware.py
      - run: npm ci && npm test && npm run check
        working-directory: integrations/cloudflare-mcp
